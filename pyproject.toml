[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-evals"
version = "0.1.0"
description = "A tool-calling analytics agent with an evaluation harness: golden scenarios, a metric registry with caveats, a reliability ledger and a deterministic mock model for CI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Isaque Carvalho" }]
keywords = ["llm", "agents", "evaluation", "tool-calling", "analytics", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/1isaqu/llm-agent-evals"
Repository = "https://github.com/1isaqu/llm-agent-evals"
Issues = "https://github.com/1isaqu/llm-agent-evals/issues"

[project.optional-dependencies]
sqlserver = ["pyodbc>=5"]
langfuse = ["langfuse>=5,<6"]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
llm-agent-evals = "llm_agent_evals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
llm_agent_evals = ["system_prompt.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "BLE"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["BLE001"]
